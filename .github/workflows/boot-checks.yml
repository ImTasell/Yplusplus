name: Y++ BOOT checks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  live-preload-integration:
    if: contains(github.event.head_commit.message, '[y++-live-preload]')
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Xvfb
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Install dependencies and build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Download the captured official AppImage
        uses: actions/download-artifact@v4
        with:
          name: yapper-appimage-research
          path: /tmp/yapper-artifact
          repository: ImTasell/Yplusplus
          run-id: 45324694945
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify both preload bridges in a live Electron renderer
        shell: bash
        run: |
          set -euo pipefail
          chmod +x /tmp/yapper-artifact/Yapper-Setup.AppImage
          mkdir -p /tmp/yplusplus-live
          cd /tmp/yplusplus-live
          /tmp/yapper-artifact/Yapper-Setup.AppImage --appimage-extract
          APPDIR="/tmp/yplusplus-live/squashfs-root"
          node "$GITHUB_WORKSPACE/dist/src/cli.js" patch "$APPDIR"

          xvfb-run -a node "$GITHUB_WORKSPACE/dist/src/cli.js" launch "$APPDIR" --no-sandbox --remote-debugging-port=9222 --remote-allow-origins=* >/tmp/yplusplus-electron.log 2>&1 &
          LAUNCH_PID=$!
          cleanup() {
            kill "$LAUNCH_PID" 2>/dev/null || true
            pkill -x yapper-desktop 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:9222/json >/tmp/yplusplus-targets.json; then
              break
            fi
            if ! kill -0 "$LAUNCH_PID" 2>/dev/null; then
              echo "Y++ launcher exited before Chromium DevTools became available."
              cat /tmp/yplusplus-electron.log || true
              exit 1
            fi
            sleep 1
          done
          if [ ! -s /tmp/yplusplus-targets.json ]; then
            echo "Chromium DevTools did not become available."
            cat /tmp/yplusplus-electron.log || true
            ps -ef | grep -E 'yapper|electron|Xvfb' || true
            exit 1
          fi

          node --input-type=module <<'NODE'
          const targets = await fetch("http://127.0.0.1:9222/json").then((r) => r.json());
          const page = targets.find((target) => target.type === "page" && target.url.startsWith("https://www.yapper.website"));
          if (!page?.webSocketDebuggerUrl) {
            throw new Error("Yapper main page did not appear in Chromium DevTools targets.");
          }

          const socket = new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            socket.addEventListener("open", resolve, { once: true });
            socket.addEventListener("error", reject, { once: true });
          });

          const response = new Promise((resolve, reject) => {
            const timeout = setTimeout(() => reject(new Error("Timed out waiting for Runtime.evaluate.")), 10000);
            socket.addEventListener("message", (event) => {
              const message = JSON.parse(event.data);
              if (message.id === 1) {
                clearTimeout(timeout);
                resolve(message);
              }
            });
          });

          socket.send(JSON.stringify({
            id: 1,
            method: "Runtime.evaluate",
            params: {
              expression: "JSON.stringify({ yplusplus: !!window.yplusplus, version: window.yplusplus?.version, ready: window.yplusplus?.ready, yapperDesktop: !!window.yapperDesktop })",
              returnByValue: true
            }
          }));

          const result = await response;
          socket.close();
          if (result.error || result.result?.exceptionDetails) {
            throw new Error(JSON.stringify(result.error ?? result.result.exceptionDetails));
          }
          const bridge = JSON.parse(result.result.result.value);
          console.log("Live renderer bridge check:", bridge);
          if (!bridge.yplusplus || bridge.version !== "0.1.0" || bridge.ready !== true || !bridge.yapperDesktop) {
            throw new Error("Y++ preload or original Yapper preload bridge is missing.");
          }
          NODE
