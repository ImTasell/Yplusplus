name: Research - Download Yapper AppImage

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/research-download-appimage.yml"

permissions:
  contents: read

jobs:
  download:
    name: Download and verify AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download official Linux AppImage
        shell: bash
        run: |
          set -euo pipefail
          url="https://files.yapper.website/desktop/Yapper-Setup.AppImage"
          output="Yapper-Setup.AppImage"

          curl             --fail             --location             --show-error             --silent             --retry 5             --retry-all-errors             --retry-delay 3             --connect-timeout 30             --max-time 900             --user-agent "Yplusplus-Research/1.0"             "$url"             --output "$output"

          test -s "$output"
          file "$output"
          size="$(stat --format=%s "$output")"
          echo "Downloaded bytes: $size"
          if [ "$size" -lt 50000000 ]; then
            echo "::error::Downloaded file is unexpectedly small; refusing to publish artifact."
            exit 1
          fi

          sha256sum "$output" | tee SHA256SUMS
          head -c 4 "$output" | od -An -tx1

      - name: Upload AppImage for inspection
        uses: actions/upload-artifact@v4
        with:
          name: yapper-appimage-research
          path: |
            Yapper-Setup.AppImage
            SHA256SUMS
          if-no-files-found: error
          retention-days: 1
